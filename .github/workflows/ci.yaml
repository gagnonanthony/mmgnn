name: CI

on:
    pull_request:
        branches:
            - main
        types: [opened,reopened,synchronize]
    push:
        branches:
            - main

jobs:
    Testing:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Set up uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
            - name: Set up Python
              run: uv python install 3.12
            - name: Install package
              run: uv pip install -e ".[dev]"
            - name: Run tests
              run: uv run pytest

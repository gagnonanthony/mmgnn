[project]
name = "mmgnn"
version = "0.1.0"
description = "Multimodal Graph Autoencoders for Brain Connectome Analysis"
readme = "README.md"
authors = [
    { name = "Anthony Gagnon", email = "anthony.gagnon7@usherbrooke.ca" }
]
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["neuroscience", "brain connectivity", "graph autoencoders", "deep learning"]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.62.0",
    "openpyxl>=3.0.0",
    "matplotlib>=3.3.0",
    "nilearn>=0.9.0",
    "nibabel>=3.2.0",
    "torch-geometric>=2.3.0",
    "scipy>=1.7.0",
    "seaborn>=0.13.2",
    "coloredlogs>=15.0.1",
    "yabplot>=0.5.1"
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-console-scripts>=1.4.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

# CLI scripts entry points
[project.scripts]
train = "mmgnn.cli.train:main"
evaluate = "mmgnn.cli.evaluate:main"
inference = "mmgnn.cli.inference:main"
ablate = "mmgnn.cli.ablate:main"
visualize = "mmgnn.cli.visualize:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

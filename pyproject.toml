[project]
name = "mmgnn"
version = "0.1.0"
description = "Multimodal Graph Neural Networks for Brain Connectome Analysis"
readme = "README.md"
authors = [
    { name = "Anthony Gagnon", email = "anthony.gagnon7@usherbrooke.ca" }
]
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["neuroscience", "brain connectivity", "graph neural networks", "deep learning"]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "optuna>=3.6.0",
    "tqdm>=4.62.0",
    "openpyxl>=3.0.0",
    "matplotlib>=3.3.0",
    "nilearn>=0.9.0",
    "nibabel>=3.2.0",
    "torch-geometric>=2.3.0",
    "scipy>=1.7.0",
    "torchlens>=1.0.0",
    "seaborn>=0.13.2",
    "ray[tune]>=2.0.0",
    "optuna>=3.6.0",
    "denseweight==0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
bctpy = { git = "https://github.com/aestrivex/bctpy.git" }
